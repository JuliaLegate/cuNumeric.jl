steps:
  - label: ":chart_with_upwards_trend: Benchmark regression vs. base branch"
    key: "regression"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
          cache_dir: "${HOME}/.cache/julia-buildkite-plugin-regression"
    command: ".buildkite/run_regression.sh"
    artifact_paths:
      - "regression/**/*"
    agents:
      queue: "cuda"
    # One comparison at a time so runs do not share a GPU.
    concurrency: 1
    concurrency_group: "cunumeric/regression"
    timeout_in_minutes: 180
    env:
      LD_LIBRARY_PATH: ""
      LEGATE_AUTO_CONFIG: "0"
      # nvidia-smi cannot read GPU memory in the CI container; cap the harness budget.
      CUNUMERIC_BENCH_FBMEM_MB: "10240"
