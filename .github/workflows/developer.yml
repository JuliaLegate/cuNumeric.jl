# Developer wrapper tests build the wrappers from source instead of using JLLs.
name: Developer Wrapper Tests

on:
  workflow_call:

jobs:
  test:
    name: Julia ${{ matrix.julia }}
    strategy:
      fail-fast: false
      matrix:
        julia:
          - '1.10'
          - '1.11'
          - '1.12'
    # runs-on: [self-hosted, linux, x64]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
        LEGATE_AUTO_CONFIG: 0
        LEGATE_WRAPPER_ENABLE_CUDA: OFF
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: bash
        run: source /etc/profile

      - name: Install basic utils
        run: |
          apt-get update && apt-get install -y wget curl git build-essential
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Install CMake 3.30.7
        run: |
          mkdir -p $HOME/.local
          cd $WORKSPACE
          wget https://github.com/Kitware/CMake/releases/download/v3.30.7/cmake-3.30.7-linux-x86_64.sh --no-check-certificate
          sh cmake-3.30.7-linux-x86_64.sh --skip-license --prefix=$HOME/.local
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
        with:
            # per-version: dev wrappers are ABI-specific
            cache-name: julia-developer-ci-${{ matrix.julia }}

      # Parse commit message or PR body for [legate-branch: <branch>].
      # Example: include "[legate-branch: my-feature]" anywhere in the message.
      - name: Detect Legate branch override
        id: legate-branch
        run: |
          MSG=$(printf '%s\n%s' \
            "${{ github.event.head_commit.message }}" \
            "${{ github.event.pull_request.body }}")
          BRANCH=$(echo "$MSG" | grep -oiP 'legate[-_]branch:\s*\K\S+' | head -1 | tr -d '[]' || true)
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if [[ -n "$BRANCH" ]]; then
            echo "Using Legate.jl branch override: $BRANCH"
          else
            echo "No Legate.jl branch override — using JLL"
          fi

      - name: Clone Legate.jl branch override
        if: steps.legate-branch.outputs.branch != ''
        run: |
          git clone --depth 1 --branch ${{ steps.legate-branch.outputs.branch }} \
            ${{ github.server_url }}/${{ github.repository_owner }}/Legate.jl.git \
            /tmp/Legate.jl

      # Develop into the workspace root so its members (incl. dev/) resolve to the override.
      - name: Build and test cuNumeric (developer mode)
        env:
          LEGATE_CHECKOUT: /tmp/Legate.jl
          LEGATE_SKIP_RUNTIME: "true"
        run: |
          rm -f Manifest.toml test/Manifest.toml dev/Manifest.toml \
                LocalPreferences.toml test/LocalPreferences.toml

          # Dev mode rebuilds the wrapper .so each run, so drop stale overrides and the
          # .ji that bake @wrapmodule bindings (cuNumeric/Legate + wrapper JLLs) — a cached
          # .ji would mismatch the fresh .so and segfault. libcxxwrap override is kept.
          DEPOT="$(julia --startup-file=no -e 'print(DEPOT_PATH[1])')"
          rm -rf "$DEPOT"/packages/*/*/override \
                 "$DEPOT"/compiled/v*/{cuNumeric,Legate,cunumeric_jl_wrapper_jll,legate_jl_wrapper_jll}

          if [[ -n "${{ steps.legate-branch.outputs.branch }}" ]]; then
            julia --color=yes --project=. -e '
                using Pkg
                Pkg.develop(PackageSpec(path = joinpath(ENV["LEGATE_CHECKOUT"], "lib/LegatePreferences")))
                Pkg.develop(PackageSpec(path = ENV["LEGATE_CHECKOUT"]))
                using LegatePreferences; LegatePreferences.use_developer_mode()
                Pkg.build("Legate")
            '
          fi

          julia --color=yes --project=. -e '
              using Pkg
              Pkg.develop(PackageSpec(path = "lib/CNPreferences"))
              using CNPreferences; CNPreferences.use_developer_mode()
              Pkg.build("cuNumeric")
          '

          cp LocalPreferences.toml test/LocalPreferences.toml

          julia --color=yes --project=. -e 'using Pkg; Pkg.test("cuNumeric"; test_args=["--jobs=2", "--verbose"])'
