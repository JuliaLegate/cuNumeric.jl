# Develeper CI test. This will build the workflow using Jlls and building wrappers from SRC
name: Develeper CI test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build instead'
        required: false
        default: ''
      mark_as_latest:
        description: 'Mark as latest'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/cunumeric_jl_wrapper/src/**'
      - 'lib/cunumeric_jl_wrapper/include/**'
      - 'lib/CNPreferences/src/**'
      - '.github/workflows/developer.yml'
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/cunumeric_jl_wrapper/src/**'
      - 'lib/cunumeric_jl_wrapper/include/**'
      - 'lib/CNPreferences/src/**'
      - '.github/workflows/developer.yml'
jobs:
  pkg_resolve:
    uses: ./.github/workflows/pkg_resolve.yml

  docs:
    name: Developer CI test - Julia ${{ matrix.julia }}
    needs: pkg_resolve
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        julia:
          - '1.10'
          - '1.11'
          - '1.12'
    # runs-on: [self-hosted, linux, x64]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
        LEGATE_AUTO_CONFIG: 0
        LEGATE_WRAPPER_ENABLE_CUDA: OFF
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: bash
        run: source /etc/profile

      - name: Install basic utils
        run: |
          apt-get update && apt-get install -y wget curl git build-essential
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Install CMake 3.30.7
        run: |
          mkdir -p $HOME/.local
          cd $WORKSPACE
          wget https://github.com/Kitware/CMake/releases/download/v3.30.7/cmake-3.30.7-linux-x86_64.sh --no-check-certificate
          sh cmake-3.30.7-linux-x86_64.sh --skip-license --prefix=$HOME/.local
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
        with:
            # per-version: developer wrapper overrides are CxxWrap-ABI-specific
            cache-name: julia-developer-ci-${{ matrix.julia }}

      # Parse commit message or PR body for [legate-branch: <branch>].
      # Example: include "[legate-branch: my-feature]" anywhere in the message.
      - name: Detect Legate branch override
        id: legate-branch
        run: |
          MSG=$(printf '%s\n%s' \
            "${{ github.event.head_commit.message }}" \
            "${{ github.event.pull_request.body }}")
          BRANCH=$(echo "$MSG" | grep -oiP 'legate[-_]branch:\s*\K\S+' | head -1 | tr -d '[]' || true)
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if [[ -n "$BRANCH" ]]; then
            echo "Using Legate.jl branch override: $BRANCH"
          else
            echo "No Legate.jl branch override — using JLL"
          fi

      - name: Clone Legate.jl branch override
        if: steps.legate-branch.outputs.branch != ''
        run: |
          git clone --depth 1 --branch ${{ steps.legate-branch.outputs.branch }} \
            ${{ github.server_url }}/${{ github.repository_owner }}/Legate.jl.git \
            /tmp/Legate.jl

      # Fresh throwaway project (not the cached global env) so dev-mode prefs/paths
      # don't get cached stale across runs; test/Project.toml is left untouched.
      - name: Build and test cuNumeric (developer mode)
        env:
          GPUTESTS: "0"
        run: |
          CI_PROJECT="$(mktemp -d)"

          # Resolve against source checkouts / Legate override, not the pinned manifest.
          rm -f Manifest.toml test/Manifest.toml dev/Manifest.toml

          if [[ -n "${{ steps.legate-branch.outputs.branch }}" ]]; then
            ( cd /tmp/Legate.jl && julia --color=yes --project="$CI_PROJECT" -e '
                using Pkg
                Pkg.develop(PackageSpec(path = "lib/LegatePreferences"))
                Pkg.develop(PackageSpec(path = "."))
                using LegatePreferences; LegatePreferences.use_developer_mode()
                Pkg.build("Legate")
            ' )
          fi

          julia --color=yes --project="$CI_PROJECT" -e '
              using Pkg
              Pkg.develop(PackageSpec(path = "lib/CNPreferences"))
              using CNPreferences; CNPreferences.use_developer_mode()
              Pkg.develop(PackageSpec(path = "."))
              Pkg.build("cuNumeric")
          '

          cp "$CI_PROJECT/LocalPreferences.toml" test/LocalPreferences.toml

          julia --color=yes --project="$CI_PROJECT" -e 'using Pkg; Pkg.test("cuNumeric")'
