name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build instead'
        required: false
        default: ''
      mark_as_latest:
        description: 'Mark as latest'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/cunumeric_jl_wrapper/**'
      - 'lib/CNPreferences/src/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/developer.yml'
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/cunumeric_jl_wrapper/**'
      - 'lib/CNPreferences/src/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/developer.yml'
jobs:
  resolve:
    name: Package resolution
    if: ${{ !contains(toJSON(github.event), '[skip ci]') }}
    uses: ./.github/workflows/pkg_resolve.yml

  wrapper_changes:
    name: Wrapper change detection
    if: ${{ !contains(toJSON(github.event), '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      wrapper_changed: ${{ steps.wrapper-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare wrapper against main
        id: wrapper-changes
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if git diff --quiet origin/main...HEAD -- lib/cunumeric_jl_wrapper; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

  developer_tests:
    name: Developer wrapper tests
    needs: [resolve, wrapper_changes]
    if: ${{ !contains(toJSON(github.event), '[skip ci]') && !contains(toJSON(github.event), '[skip dev]') && (github.event_name != 'pull_request' || github.base_ref == 'main' || needs.wrapper_changes.outputs.wrapper_changed == 'true') }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      actions: write
    uses: ./.github/workflows/developer.yml

  jll_tests:
    name: JLL wrapper tests - Julia ${{ matrix.julia }} - ${{ matrix.os }}
    needs: [resolve, wrapper_changes]
    if: ${{ !contains(toJSON(github.event), '[skip ci]') && !contains(toJSON(github.event), '[skip jll]') && (github.base_ref == 'main' || needs.wrapper_changes.outputs.wrapper_changed != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia:
          - '1.10'
          - '1.11'
          - '1.12'
        os:
          - ubuntu-latest
        # include:
        #   - julia: '1.12'
        #     allow-failure: true
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v2

      - name: Detect Legate branch override
        id: legate-branch
        run: |
          MSG=$(printf '%s\n%s' \
            "${{ github.event.head_commit.message }}" \
            "${{ github.event.pull_request.body }}")
          BRANCH=$(echo "$MSG" | grep -oiP 'legate[-_]branch:\s*\K\S+' | head -1 | tr -d '[]' || true)
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          if [[ -n "$BRANCH" ]]; then
            echo "Using Legate.jl branch override: $BRANCH"
          else
            echo "No Legate.jl branch override — using JLL"
          fi

      - name: Checkout Legate.jl branch override
        if: steps.legate-branch.outputs.branch != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Legate.jl
          ref: ${{ steps.legate-branch.outputs.branch }}
          path: Legate.jl

      - name: Develop Legate.jl branch override
        if: steps.legate-branch.outputs.branch != ''
        run: |
          julia --color=yes -e '
              using Pkg;
              Pkg.develop(PackageSpec(path = "Legate.jl/lib/LegatePreferences"))
              Pkg.develop(PackageSpec(path = "Legate.jl"))
          '

      - name: Run tests
        env:
          LEGATE_SHOW_CONFIG: "1"
          LEGATE_AUTO_CONFIG: "0"
          LEGATE_SKIP_RUNTIME: "true"
          LEGATE_CONFIG: "--cpus 1 --utility 1 --sysmem 500"
        run: julia --project -e 'using Pkg; Pkg.test(test_args=["--jobs=2", "--verbose"])'
