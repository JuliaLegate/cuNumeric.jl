name: CI CPU

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build instead'
        required: false
        default: ''
      mark_as_latest:
        description: 'Mark as latest'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/CNPreferences/src/**'
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'deps/build.jl'
      - 'Project.toml'
      - 'lib/CNPreferences/src/**'
jobs:
  check_changes:
    name: Check for wrapper changes
    runs-on: ubuntu-latest
    outputs:
      wrapper_changed: ${{ steps.filter.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wrapper:
              - 'lib/cunumeric_jl_wrapper/**'

  test:
    name: Julia ${{ matrix.julia }} - ${{ matrix.os }}
    needs: check_changes
    if: ${{ github.base_ref == 'main' || needs.check_changes.outputs.wrapper_changed != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia:
          - '1.10'
          - '1.11'
          - '1.12'
        os:
          - ubuntu-latest
        # include:
        #   - julia: '1.12'
        #     allow-failure: true
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v2

      - name: Run tests
        env:
          GPUTESTS: "0" # parsed by runtests.jl
          LEGATE_SHOW_CONFIG: "1"
          LEGATE_AUTO_CONFIG: "0"
          LEGATE_CONFIG: "--cpus 1 --utility 1 --sysmem 4000"
        run: julia --project -e 'using Pkg; Pkg.test(test_args=["--quickfail"])'
