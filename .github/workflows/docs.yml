name: Docs
on:
  push:
    branches:
      - main
    # Tag pushes must not share a `paths:` filter with branch pushes: GitHub
    # requires both filters to match, and tag events often have no path diff,
    # so release docs would never deploy.
    tags:
      - 'v*'
  pull_request:
    paths:
    - '.github/workflows/docs.yml'
    - 'src/**'
    - 'docs/src/**'
    - 'docs/make.jl'
    - 'docs/Project.toml'
    - 'README.md'
    - 'lib/CNPreferences/**'
jobs:
  check_changes:
    name: Check for wrapper changes
    runs-on: ubuntu-latest
    outputs:
      wrapper_changed: ${{ steps.filter.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wrapper:
              - 'lib/cunumeric_jl_wrapper/**'

  docs:
    name : Documentation
    needs: check_changes
    # Always build on tags/releases. On PRs/pushes, skip only when the C++ wrapper
    # changed (those PRs use a different docs path). `base_ref` is set for PRs.
    if: ${{ github.ref_type == 'tag' || github.base_ref == 'main' || needs.check_changes.outputs.wrapper_changed != 'true' }}
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    env:
      LEGATE_AUTO_CONFIG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2

      - name: Setup cuNumeric.jl
        run: |
          julia --color=yes --project=docs -e '
              using Pkg
              Pkg.develop(PackageSpec(path = "lib/CNPreferences"))
              Pkg.develop(PackageSpec(path = "."))
          '
      - name: Instantiate docs environment
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
