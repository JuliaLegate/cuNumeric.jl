name: Docs
on:
  push:
    # Any branch, when docs-affecting paths change.
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-tags.yml'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'lib/CNPreferences/**'
  pull_request:
    # open / synchronize / reopen (pushes to a PR branch).
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-tags.yml'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'lib/CNPreferences/**'
  workflow_dispatch:
jobs:
  docs:
    name: Documentation
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    env:
      LEGATE_AUTO_CONFIG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2

      - name: Setup cuNumeric.jl
        run: |
          julia --color=yes --project=docs -e '
              using Pkg
              Pkg.develop(PackageSpec(path = "lib/CNPreferences"))
              Pkg.develop(PackageSpec(path = "."))
          '
      - name: Instantiate docs environment
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
