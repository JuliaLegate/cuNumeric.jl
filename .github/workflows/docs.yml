name: Docs
on:
  push:
    # All branches when docs-affecting paths change (including PR source branches).
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-tags.yml'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'lib/CNPreferences/**'
  pull_request:
    # Fires on open/sync/reopen — i.e. pushes to a PR branch.
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-tags.yml'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'lib/CNPreferences/**'
  workflow_dispatch:
jobs:
  check_changes:
    name: Check for wrapper changes
    runs-on: ubuntu-latest
    outputs:
      wrapper_changed: ${{ steps.filter.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wrapper:
              - 'lib/cunumeric_jl_wrapper/**'

  docs:
    name : Documentation
    needs: check_changes
    # Always build on manual dispatch and on PRs to main. Otherwise skip only
    # when the C++ wrapper changed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || needs.check_changes.outputs.wrapper_changed != 'true' }}
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    env:
      LEGATE_AUTO_CONFIG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2

      - name: Setup cuNumeric.jl
        run: |
          julia --color=yes --project=docs -e '
              using Pkg
              Pkg.develop(PackageSpec(path = "lib/CNPreferences"))
              Pkg.develop(PackageSpec(path = "."))
          '
      - name: Instantiate docs environment
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
