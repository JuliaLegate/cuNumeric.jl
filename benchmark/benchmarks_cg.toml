[Global]
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]
n_warmup = 1
n_iter = 1
n_trial = 5
check_correctness = true
auto_size = false

[plot.groups]
cg = ["cg", "cg_plain"]

# Default accelerated solve; runs on every model.
[[cg]]
T = "Float64"
N = 65536
M = 1
gpus = 1
cpus = 8
kwargs = { check_every = 10, max_iter = 1000 }

# cuNumeric solve without the @accelerate macro, for the accelerate comparison.
[[cg_plain]]
models = ["cunumeric"]
T = "Float64"
N = 65536
M = 1
gpus = 1
cpus = 8
kwargs = { check_every = 10, max_iter = 1000 }
