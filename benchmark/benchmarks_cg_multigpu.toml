# CG weak scaling from the 9,000,000-element single-GPU Class E problem.
[Global]
models = ["cunumeric", "cupynumeric", "jacc", "dagger"]
n_warmup = 1
n_iter = 1
n_trial = 5
check_correctness = true
auto_size = false

[[cg]]
models = ["cunumeric", "cupynumeric", "jacc", "dagger"]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
N = [9000000, 18000000, 36000000, 72000000]
M = 1
kwargs = { check_every = 10, max_iter = 1000 }
