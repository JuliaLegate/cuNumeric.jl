# cuNumeric fused mapreduce versus broadcast materialization followed by sum.
#   julia --project=. run.jl --config=benchmarks_montecarlo.toml
[Global]
n_warmup = 2
n_iter = 50
n_trial = 5
check_correctness = true
auto_size = true
mem_frac = 0.75
models = ["cunumeric"]

[plot.groups]
montecarlo = ["montecarlo", "montecarlo_naive"]

[[montecarlo]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true

[[montecarlo_naive]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true
