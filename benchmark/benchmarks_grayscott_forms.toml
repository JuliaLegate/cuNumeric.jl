# Gray-Scott @accelerate scope-contract comparison (cuNumeric only).
# The four accelerated forms plus the baseline share one weak-scaling figure.
#   julia --project=. run.jl --config=benchmarks_grayscott_forms.toml
[Global]
n_warmup = 2
n_iter = 250
n_trial = 5
models = ["cunumeric"]
check_correctness = true
n_correctness_iter = 5
auto_size = true
mem_frac = 0.75

[plot.groups]
grayscott = [
    "grayscott_plain",
    "grayscott_function_accelerated",
    "grayscott_begin_accelerated",
    "grayscott_let_accelerated",
    "grayscott_expression_accelerated",
]

[[grayscott_plain]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true

[[grayscott_function_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true

[[grayscott_begin_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true

[[grayscott_let_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true

[[grayscott_expression_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true
