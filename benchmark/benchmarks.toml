[Global]
n_warmup = 5
n_iter = 1000
n_trial = 5
cupynumeric = true # (needs install_cupynumeric.sh)
cuda = false # compare against CUDA.jl (single-GPU configs only)
# One CPU-reference check per config (not per timed iter). Written to CSV.
check_correctness = true
n_correctness_iter = 5

####################################
#             GEMM                 #
# Weak scaling, restricted to NxN. #
# Work ~ 2*N^2*M = 2*N^3.          #
# N^3 / P --> constant.            #
# N = baseline * P^(1/3).          #
####################################

[[gemm]]
T = ["Float32"]
gpus = [1, 2, 4, 8]
cpus = 16
N = [20000, 25200, 31752, 40000]
M = [20000, 25200, 31752, 40000]

#################################
#         Gray-Scott            #
# Weak scaling, square NxN grid.#
# Work ~ N*M = N^2.             #
# N^2 / P --> constant.         #
# N = baseline * P^(1/2).       #
#################################

[[grayscott_baseline]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

[[grayscott_function_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

