[Global]
n_warmup = 5
n_iter = 1000
n_trial = 5
cupynumeric = true # (needs install_cupynumeric.sh)
cuda = true         # also run CUDA.jl (single-GPU configs only)
# When gpus == 1, cuNumeric compares a tiny problem against CUDA.jl.
# CUDA.jl is still timed; its CSV correctness column is skipped.
check_correctness = true
n_correctness_iter = 5

# Names in a list share one weak-scaling figure. Unlisted [[benchmark]]
# tables each get their own. CUDA.jl and cupynumeric overlay from the
# group's baseline member (`*_baseline`, else the only / first name).
[plot.groups]
grayscott = [
    "grayscott_baseline",
    "grayscott_function_accelerated",
    "grayscott_begin_accelerated",
    "grayscott_let_accelerated",
    "grayscott_expression_accelerated",
]
dmd = ["dmd_baseline", "dmd_accelerated"]

####################################
#             GEMM                 #
# Weak scaling, restricted to NxN. #
# Work ~ 2*N^2*M = 2*N^3.          #
# N^3 / P --> constant.            #
# N = baseline * P^(1/3).          #
####################################

[[gemm]]
T = ["Float32"]
gpus = [1, 2, 4, 8]
cpus = 16
N = [20000, 25200, 31752, 40000]
M = [20000, 25200, 31752, 40000]

#################################
#         Gray-Scott            #
# Weak scaling, square NxN grid.#
# Work ~ N*M = N^2.             #
# N^2 / P --> constant.         #
# N = baseline * P^(1/2).       #
#################################

[[grayscott_baseline]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

[[grayscott_function_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

[[grayscott_begin_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

[[grayscott_let_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

[[grayscott_expression_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [24000, 33944, 48000, 67888]
M = [24000, 33944, 48000, 67888]

#################################
#              DMD              #
# Snapshot matrix N × M         #
# (space × time), r=min(20,M-1).#
# FLOPs (m=N, n=M-1):           #
#   2mn² + 11n³   thin SVD      #
#   2mnr + mr     B = X2 V Σ⁻¹  #
#   2mr²          Ã = U' B      #
#   25r³          eigen(Ã)      #
#   2mr²          Φ = B W       #
# M fixed ⇒ n,r fixed ⇒ W ~ N.  #
# Weak scaling: N / P constant. #
# N = 50000 * P.                #
# M is the intensity knob: AI   #
# ~ n²/M ~ M, independent of P. #
#################################

[[dmd_baseline]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [50000, 100000, 200000, 400000]
M = 512

[[dmd_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [50000, 100000, 200000, 400000]
M = 512

#################################
#     Spectral Poisson (FFT)    #
# M independent N×N Poisson     #
# solves (∇²u = f, periodic).   #
# Transform is the last 2 axes; #
# batch axis M may split GPUs.  #
# Work ~ M N² log N.            #
# Weak scaling: M / P constant. #
# M = 8 * P, N = 1024.          #
#################################

[[poisson_fft]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
N = 1024
M = [8, 16, 32, 64]

#################################
#   Monte-Carlo Integration     #
#  Work ~ N. Scale N linearly   #
#################################

[[montecarlo]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
N = [1_000_000, 2_000_000, 4_000_000, 8_000_000]

#########################################
# Three-mode tensor projection          #
# D[n,m,l] = A[i,j,k] B[n,i] B[m,j]    #
#            B[l,k]                     #
# Optimal pairwise work ~ 6*N^4.        #
#########################################

[[tensor_projection3]]
T = "Float32"
gpus = 1
cpus = 16
N = [32, 64, 128]
cuda = true
n_warmup = 3
n_iter = 20
n_trial = 5

#########################################
# Rank-4 two-index tensor contraction   #
# C[a,b,c,d] = X[a,i,c,j] Y[i,b,j,d]   #
# Work ~ 2*N^6.                         #
#########################################

[[tensor_contract4]]
T = "Float32"
gpus = 1
cpus = 16
N = [12, 16, 24]
cuda = true
n_warmup = 3
n_iter = 20
n_trial = 5
