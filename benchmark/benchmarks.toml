[Global]
n_warmup = 5
n_iter = 1000
n_trial = 5
cupynumeric = true # (needs install_cupynumeric.sh)
cuda = false # compare against CUDA.jl (single-GPU configs only)

####################################
#             GEMM                 #
# Weak scaling, restricted to NxN. #
# Work ~ 2*N^2*M = 2*N^3.          #
# N^3 / P --> constant.            #
# N = baseline * P^(1/3).          #
####################################

[[gemm]] # small: baseline N = 20000
T = ["Float32", "Float64"]
gpus = [1, 2, 4, 8]
cpus = 16
N = [20000, 25200, 31752, 40000]
M = [20000, 25200, 31752, 40000]

#################################
#         Gray-Scott            #
# Weak scaling, square NxN grid.#
# Work ~ N*M = N^2.             #
# N^2 / P --> constant.         #
# N = baseline * P^(1/2).       #
#################################

[[grayscott_baseline]] # small: baseline N = 2000
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = [true, false]
N = [2000, 2832, 4000, 5656]
M = [2000, 2832, 4000, 5656]

[[grayscott_lifetimes]] # small: baseline N = 2000
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
fusion = false
N = [2000, 2832, 4000, 5656]
M = [2000, 2832, 4000, 5656]

#################################
#   Monte-Carlo Integration     #
#  Work ~ N. Scale N linearly   #
#################################

[[montecarlo]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 16
N = [1_000_000, 2_000_000, 4_000_000, 8_000_000]
