# Minimal end-to-end launcher check:
# julia --project=. run.jl --config=benchmarks_smoke.toml
# Select another model with --models=cunumeric, --models=jacc, etc.
[Global]
models = ["cudajl"]
n_warmup = 1
n_iter = 1
