# Minimal end-to-end launcher check:
# julia --project=. run.jl --config=benchmarks_smoke.toml
# Select another model with --models=cunumeric, --models=jacc, etc.
[Global]
models = ["cunumeric", "cupynumeric", "cudajl", "jacc"]
n_warmup = 2
n_iter = 10
n_trial = 5
check_correctness = true
auto_size = false
mem_frac = 0.01

[[montecarlo]]
T = "Float32"
gpus = 1
cpus = 1
N = 1024
M = 1
